<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Spot the Stall</title>
<meta name="description" content="A three-round practice game for spotting a task initiation stall, finding where it begins, and naming its pattern.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%223%22 y=%226%22 width=%2226%22 height=%2220%22 rx=%224%22 fill=%22%232B4BA0%22/%3E%3Crect x=%228%22 y=%2212%22 width=%2216%22 height=%223%22 rx=%221.5%22 fill=%22%23fff%22/%3E%3Crect x=%228%22 y=%2218%22 width=%2210%22 height=%223%22 rx=%221.5%22 fill=%22%23FFF2C2%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: one index card at the center of a quiet desk; a sticky-note speech bubble sits beside it (below it on phones). */
:root {
  --bg: #E6ECF1;
  --bg-deep: #D9E1E8;
  --card: #FFFFFF;
  --ink: #18212C;
  --muted: #4A5665;
  --rule: #DCE4EC;
  --margin-line: #C9D5F2;
  --accent: #2B4BA0;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9F8;
  --note: #FFF2C2;
  --note-edge: #E9D58A;
  --note-ink: #2A2410;
  --ok: #1C6644;
  --ok-soft: #E1F2E8;
  --retry: #7A4600;
  --retry-soft: #FBEBD3;
  --focus: #1F3F99;
  --shadow: 0 1px 2px rgba(24,33,44,.08), 0 8px 24px rgba(24,33,44,.08);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121820; --bg-deep: #0D1218; --card: #1C2530; --ink: #E8EDF2; --muted: #AAB5C2;
    --rule: #2A3542; --margin-line: #34436B; --accent: #A9BDF7; --accent-ink: #0F1830; --accent-soft: #24304D;
    --note: #3A3420; --note-edge: #5C5130; --note-ink: #F4ECD2;
    --ok: #8DD9B1; --ok-soft: #1B3328; --retry: #F3BE78; --retry-soft: #3A2C17; --focus: #C5D3FA;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121820; --bg-deep: #0D1218; --card: #1C2530; --ink: #E8EDF2; --muted: #AAB5C2;
  --rule: #2A3542; --margin-line: #34436B; --accent: #A9BDF7; --accent-ink: #0F1830; --accent-soft: #24304D;
  --note: #3A3420; --note-edge: #5C5130; --note-ink: #F4ECD2;
  --ok: #8DD9B1; --ok-soft: #1B3328; --retry: #F3BE78; --retry-soft: #3A2C17; --focus: #C5D3FA;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
  min-height: 100%;
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }

.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
.brand { display: grid; gap: 2px; min-width: 0; }
.eyebrow { font-size: .8125rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.75rem, 4vw, 2.25rem); line-height: 1.1; margin: 0; letter-spacing: -.01em; }

.rounds { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
.rounds li {
  font-size: .875rem; padding: 6px 12px; border-radius: 999px;
  border: 1.5px solid var(--rule); color: var(--muted); background: var(--card);
  display: inline-flex; align-items: center; gap: 6px;
}
.rounds li[aria-current="step"] { border-color: var(--accent); color: var(--ink); font-weight: 700; }
.rounds li.done { color: var(--ink); }
.rounds li.done::before { content: "\2713"; font-weight: 700; color: var(--ok); }

/* Stage */
.stage {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 36rem) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}
.center { grid-column: 2; display: grid; gap: 20px; min-width: 0; }
.side { grid-column: 3; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 1020px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .center, .side { grid-column: 1; }
  .center { max-width: 38rem; width: 100%; margin: 0 auto; }
  .side { position: static; max-width: 38rem; width: 100%; margin: 0 auto; }
}

.progress { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.progress-label { font-size: .9375rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 8px; list-style: none; margin: 0; padding: 0; }
.dots li { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; }
.dots li.done { background: var(--accent); border-color: var(--accent); }
.dots li.current { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--card); }

/* Index card */
.card {
  background-color: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px 28px 28px;
  min-width: 0;
}
.card:focus { outline: none; }
.card:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
.card-kicker { font-size: .8125rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.2; margin: 0 0 12px; text-wrap: balance; }
.scene { font-size: clamp(1.2rem, 2.4vw, 1.375rem); line-height: 1.55; margin: 0; max-width: 34em; }
.card p { max-width: 62ch; }
.card p + p { margin-top: 12px; }
.intro-list { margin: 12px 0 0; padding-left: 1.2em; display: grid; gap: 6px; }

/* Buttons */
button { font: inherit; color: inherit; }
.btn {
  appearance: none; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 1.0625rem; padding: 12px 22px; border-radius: 8px; cursor: pointer;
  min-height: 48px; line-height: 1.2;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--card); color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); filter: none; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; }

.choice-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.choice {
  appearance: none; cursor: pointer; min-height: 64px; padding: 14px 16px; border-radius: 10px;
  background: var(--card); border: 2px solid var(--accent); color: var(--ink);
  font-family: var(--font-display); font-weight: 700; font-size: 1.25rem;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  box-shadow: var(--shadow);
}
.choice:hover { background: var(--accent-soft); }
.choice .tag { font-family: var(--font-body); font-size: .8125rem; font-weight: 700; letter-spacing: .02em; }
.choice.tried { border-style: dashed; border-color: var(--retry); }
.choice.tried .tag { color: var(--retry); }
.choice.right { border-color: var(--ok); background: var(--ok-soft); }
.choice.right .tag { color: var(--ok); }

/* Story lines */
.step-prompt { font-weight: 700; margin: 0 0 12px; display: flex; gap: 10px; align-items: baseline; }
.step-num { font-size: .8125rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.line-btn {
  appearance: none; width: 100%; text-align: left; cursor: pointer;
  background: transparent; border: 2px solid transparent; border-radius: 8px;
  padding: 8px 12px; font-size: 1.1875rem; line-height: 1.45;
  display: grid; grid-template-columns: 1.6em minmax(0,1fr); gap: 6px; align-items: start;
}
.line-btn:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
.line-btn .ln { color: var(--muted); font-size: .9375rem; font-variant-numeric: tabular-nums; padding-top: 3px; }
.line-btn .badge { grid-column: 2; justify-self: start; font-size: .8125rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-top: 4px; }
.line-btn.tried { border-style: dashed; border-color: var(--retry); }
.line-btn.tried .badge { color: var(--retry); background: var(--retry-soft); }
.line-btn.hit { border-color: var(--ok); background: var(--ok-soft); }
.line-btn.hit .badge { color: var(--ok); background: var(--card); border: 1.5px solid var(--ok); }
.line-btn.locked { cursor: default; }
.line-btn.locked:hover:not(.hit):not(.tried) { background: transparent; border-color: transparent; }
.line-enter { animation: lineIn .45s ease-out both; }
@keyframes lineIn { from { opacity: .15; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.show-all { margin-top: 12px; background: none; border: none; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 0; font-size: .9375rem; }

.patterns { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
@media (max-width: 560px) { .patterns { grid-template-columns: minmax(0,1fr); } .choice-pair { gap: 10px; } }
.pattern {
  appearance: none; cursor: pointer; text-align: left; background: var(--card); color: var(--ink);
  border: 2px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; align-content: start;
  box-shadow: var(--shadow);
}
.pattern:hover { border-color: var(--accent); }
.pattern strong { font-family: var(--font-display); font-size: 1.0625rem; font-weight: 700; }
.pattern span { font-size: .9375rem; color: var(--muted); }
.pattern .badge { font-size: .8125rem; font-weight: 700; justify-self: start; padding: 2px 10px; border-radius: 999px; margin-top: 4px; }
.pattern.tried { border-style: dashed; border-color: var(--retry); }
.pattern.tried .badge { color: var(--retry); background: var(--retry-soft); }
.pattern.hit { border-color: var(--ok); background: var(--ok-soft); }
.pattern.hit .badge { color: var(--ok); background: var(--card); border: 1.5px solid var(--ok); }
.section-h { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; margin: 0; }

/* Round 3 */
.picks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pick {
  display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 12px; align-items: start; cursor: pointer;
  background: var(--card); border: 2px solid var(--rule); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow);
}
.pick:hover { border-color: var(--accent); }
.pick:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.pick:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 3px; }
.pick input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); }
.pick-text { display: grid; gap: 2px; }
.pick-text .pname { font-size: .8125rem; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.pick-text .pname::before { content: "Pattern: "; }
.pick input:checked ~ .pick-text .pname { color: var(--accent); }
details.ref { background: var(--card); border-radius: 10px; border: 2px solid var(--rule); padding: 4px 16px; }
details.ref summary { cursor: pointer; font-weight: 700; color: var(--accent); padding: 10px 0; }
details.ref dl { margin: 4px 0 12px; display: grid; gap: 10px; }
details.ref dt { font-weight: 700; }
details.ref dd { margin: 0; color: var(--muted); }
.inline-msg { color: var(--retry); font-weight: 700; margin: 0; }
.inline-msg::before { content: "\2192\00a0"; }

/* Snapshot */
.snap h2 { font-size: 1.75rem; }
.snap-date { color: var(--muted); font-size: .9375rem; margin: -6px 0 16px; }
.snap-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.snap-list li { display: grid; gap: 2px; }
.snap-list strong { font-family: var(--font-display); font-size: 1.25rem; }
.snap-list span { color: var(--muted); }
.snap-foot { margin-top: 18px; font-size: .9375rem; color: var(--muted); }
.status { font-size: .9375rem; color: var(--muted); min-height: 1.5em; margin: 0; }

/* Bubble */
.bubble {
  position: relative; background: var(--note); color: var(--note-ink); border: 1.5px solid var(--note-edge);
  border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); display: grid; gap: 10px;
}
.bubble::before {
  content: ""; position: absolute; left: -11px; top: 34px; width: 20px; height: 20px;
  background: var(--note); border-left: 1.5px solid var(--note-edge); border-bottom: 1.5px solid var(--note-edge);
  transform: rotate(45deg);
}
@media (max-width: 1020px) {
  .bubble::before { left: 40px; top: -11px; border-left: 1.5px solid var(--note-edge); border-top: 1.5px solid var(--note-edge); border-bottom: 0; }
}
.bubble:focus { outline: none; }
.bubble-who { font-size: .8125rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .85; margin: 0; }
.bubble-rest { margin: 0; }
.fb { display: grid; gap: 8px; }
.fb:empty { display: none; }
.fb-label { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-family: var(--font-display); font-size: 1.125rem; margin: 0; }
.fb-label .ico { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: .9rem; line-height: 1; flex: none; }
.fb-label.ok .ico { background: var(--ok); color: var(--card); }
.fb-label.retry .ico { background: transparent; border: 2px dashed var(--retry); color: var(--note-ink); }
.fb p { margin: 0; }
.fb .note { border-top: 1.5px dashed var(--note-edge); padding-top: 8px; }
.fb .note b { display: block; }
.fb .clue b { font-weight: 700; }
.bubble .btn { justify-self: start; }

/* Closing */
.closing { font-family: var(--font-display); font-size: clamp(1.35rem, 3vw, 1.75rem); line-height: 1.35; font-weight: 500; margin: 0; text-wrap: pretty; }

@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    --bg: #FFFFFF; --card: #FFFFFF; --ink: #000000; --muted: #333333; --accent: #1F3A85; color-scheme: light;
  }
  body { background: #FFFFFF; padding: 0; }
  body.printing-snap .top, body.printing-snap .side, body.printing-snap .center > :not(#snapCard) { display: none !important; }
  body.printing-snap .stage { display: block; }
  body.printing-snap #snapCard { box-shadow: none; border: 1.5px solid #999999; max-width: 40rem; margin: 0 auto; break-inside: avoid; }
}
@media (prefers-reduced-motion: reduce) {
  .line-enter { animation: none; }
  * { scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">ADHD and AI &middot; Module 1, Lesson 1</span>
      <h1>Spot the Stall</h1>
    </div>
    <nav aria-label="Rounds">
      <ol class="rounds" id="rounds">
        <li data-r="1">Round 1</li>
        <li data-r="2">Round 2</li>
        <li data-r="3">Round 3</li>
      </ol>
    </nav>
  </header>

  <main class="stage">
    <div class="center" id="center"></div>
    <aside class="side" aria-label="Feedback">
      <div class="bubble" id="bubble" tabindex="-1">
        <p class="bubble-who" aria-hidden="true">Feedback</p>
        <p class="bubble-rest" id="bubbleRest"></p>
        <div class="fb" id="fb" aria-live="polite" aria-atomic="true"></div>
        <div id="bubbleAction"></div>
      </div>
    </aside>
  </main>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Content ---------- */
  const PATTERNS = [
    { id: "first", name: "Can't make the first move", def: "The task is clear, but the action doesn't follow." },
    { id: "switch", name: "Switching tasks", def: "Starting one thing, drifting to another, then another, without much progress on any single task." },
    { id: "over", name: "Overthinking the first step", def: "Turning a simple starting point over and over, looking for the “right” way to begin." },
    { id: "decide", name: "Waiting on a decision", def: "The task can't start until something else gets decided first." },
    { id: "where", name: "Not knowing where to begin", def: "More than one possible starting point, and none of them feels like the right one." },
    { id: "deadline", name: "No deadline", def: "Without a due date or someone waiting on it, a task can sit untouched." },
    { id: "dread", name: "Some dread attached", def: "Nothing about the task is complicated, but starting it means dealing with a feeling, not just a step." }
  ];
  const P = Object.fromEntries(PATTERNS.map(p => [p.id, p]));

  const R1 = [
    { id: 1, scene: "You planned to start a project at 2:00. It's 2:40. The file is open, and you're still looking at the title slide.", stall: true,
      fb: "This is a stall. You meant to start, and the start didn't happen.", clue: "Compare the time you planned to start with the time it is now." },
    { id: 2, scene: "You finish one section of the form and take the ten-minute break you planned. Ten minutes later, you're back.", stall: false,
      fb: "This is not a stall. A planned break with a return is part of the work.", clue: "Notice what happened when the ten minutes were up." },
    { id: 3, scene: "You sent the draft to a coworker. You can't continue until they reply.", stall: false,
      fb: "This is not a stall. The next move belongs to someone else.", clue: "Ask yourself whose move comes next. A stall is when the next move is yours." },
    { id: 4, scene: "The laundry has been in the basket since Sunday. You walk past it every day and think, “Later.”", stall: true,
      fb: "This is a stall. “Later” keeps repeating, and the task hasn't moved.", clue: "Notice how many times “Later” has come up, and whether the task has moved." },
    { id: 5, scene: "You look at your list and move the closet cleanup to next month, because this week is full.", stall: false,
      fb: "This is not a stall. This was a choice made on purpose, with a new date.", clue: "Notice whether the task got a new date on purpose." },
    { id: 6, scene: "You need to reply to a message. You've opened it four times today and closed it each time.", stall: true,
      fb: "This is a stall. You keep arriving at the task without beginning it.", clue: "Count how many times you've opened the message, and what happened each time." }
  ];

  const LINE_CLUE = "Look for the line where the task stops moving forward.";
  const R2 = [
    { title: "The bill", pattern: "first",
      lines: ["The bill is due Friday.", "You open the banking app.", "The amount is typed in.", "Your thumb rests over the Pay button. Minutes pass.", "The screen dims."],
      stall: 3, fb: "Everything was ready. The action just didn't follow." },
    { title: "The kitchen counter", pattern: "switch",
      lines: ["You start clearing the kitchen counter.", "You carry a mug to the sink and notice the plant needs water.", "You fill the watering can and see the mail on the table.", "You open one envelope.", "The counter looks the same as before."],
      stall: 1, altLines: { 2: "This one works too. The drift started one line earlier." },
      fb: "Each new thing pulled you one step further from the counter." },
    { title: "The message", pattern: "over",
      lines: ["You need to tell a friend you can't come on Saturday.", "You type, “Hi, so sorry.”", "You delete it. Is that too formal?", "You type, “Hey, bad news.” You delete that too.", "Twenty minutes later, the message box is empty."],
      stall: 2, altPattern: { dread: "This one fits too. Canceling on a friend can carry a feeling." },
      fb: "The search for the right opening replaced the opening." },
    { title: "The gift", pattern: "decide",
      lines: ["Your sister's birthday is in two weeks.", "You sit down to order a gift.", "You can't settle between the book and the scarf.", "You close the tab to think about it.", "A week later, nothing is ordered."],
      stall: 2, fb: "The order is stuck behind one unresolved choice." },
    { title: "The spare room", pattern: "where",
      lines: ["The spare room needs clearing out.", "You stand in the doorway.", "The boxes? The shelf? The pile by the window?", "Each one seems like the wrong place to start.", "You close the door."],
      stall: 3, altLines: { 2: "This one works too. The search for a place to start begins here." },
      fb: "There were several ways in, and none felt like the right one." },
    { title: "The résumé", pattern: "deadline",
      lines: ["You want to update your résumé.", "No one has asked for it.", "There's no date attached.", "Each weekend, it moves to the next weekend.", "It's been four months."],
      stall: 3, fb: "With no due date and no one waiting, the task just sits." },
    { title: "The envelope", pattern: "dread",
      lines: ["An envelope from the tax office arrives.", "Opening it would take five seconds.", "You put it on the shelf, face down.", "Your stomach tightens each time you walk past it.", "It's been there nine days."],
      stall: 2, fb: "The step is simple. Starting it means dealing with a feeling, not just a step." }
  ];

  const R3 = [
    { id: "first", text: "I knew what to do, and the action didn't follow." },
    { id: "switch", text: "I started one thing and drifted to another." },
    { id: "over", text: "I kept turning the first step over, looking for the right way to begin." },

    return c;
  }
  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  async function saveImage(items, status) {
    status.textContent = "Preparing your image…";
    try { await document.fonts.ready; } catch (e) {}
    const canvas = drawSnapshot(items);
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const filename = "my-stall-snapshot.png";
    if (downloads) {
      try { await downloads.save({ filename, data: blob }); status.textContent = "Saved."; }
      catch (e) {
        if (e && e.code === "declined") status.textContent = "Not saved. You can try again anytime.";
        else if (e && e.code === "rate_limited") status.textContent = "A save is already waiting for you. Finish that one first.";
        else showImageFallback(canvas, status);
      }
      return;
    }
    if (standalone) {
      const a = h("a", { href: URL.createObjectURL(blob), download: filename });
      document.body.append(a); a.click(); a.remove();
      status.textContent = "Saved to your downloads.";
      return;
    }
    showImageFallback(canvas, status);
  }
  function showImageFallback(canvas, status) {
    const img = h("img", { src: canvas.toDataURL("image/png"), alt: "My stall snapshot, as an image", style: "display:block;width:100%;border-radius:8px;margin-top:8px" });
    status.replaceChildren("Here's your snapshot as an image. Right-click it, or press and hold on a phone, to save it.", img);
  }

  function viewClosing() {
    setRounds(0, 3);
    const card = h("section", { class: "card", "aria-labelledby": "endH" },
      h("p", { class: "card-kicker", text: "All three rounds complete" }),
      h("h2", { id: "endH", class: "sr-only", text: "You finished Spot the Stall" }),
      h("p", { class: "closing", text: CLOSING }));
    center.replaceChildren(card, h("div", { class: "btn-row" },
      h("button", { class: "btn ghost", type: "button", text: "See my snapshot again", onclick: () => go("snapshot") }),
      h("button", { class: "btn ghost", type: "button", text: "Play again", onclick: () => { S = freshState(); go("welcome"); } })));
    bubbleRest("You've finished. Come back to the snapshot anytime you want a reminder.");
  }

  window.addEventListener("afterprint", () => document.body.classList.remove("printing-snap"));

  /* ---------- Saved picks (this browser only) ---------- */
  const STORE = "spot-the-stall:snapshot";
  function savePicks() {
    try { localStorage.setItem(STORE, JSON.stringify({ picks: S.picks, date: S.snapDate })); } catch (e) {}
  }
  function loadPicks() {
    try { const d = JSON.parse(localStorage.getItem(STORE) || "null"); if (d && Array.isArray(d.picks)) return d; } catch (e) {}
    return null;
  }

  /* ---------- Runtime hooks ---------- */
  const standalone = !window.claude;
  let downloads = null;
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});
  }

  function start(data) {
    S = data && data.S && data.S.view ? Object.assign(freshState(), data.S) : freshState();
    if (S.view === "r2" && S.shown < 5 && reduceMotion) S.shown = 5;
    render();
  }
  if (window.claude?.hot?.snapshot) window.claude.hot.snapshot(() => ({ S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
<script>
/* Reports the game's height to the WordPress page so the embed fits without scrollbars. */
(function () {
  if (window.parent === window) return;
  var wrap = document.querySelector(".wrap"), last = 0;
  function send() {
    var cs = getComputedStyle(document.body);
    var h = Math.ceil(wrap.getBoundingClientRect().height + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom));
    if (Math.abs(h - last) > 2) { last = h; window.parent.postMessage({ type: "spot-the-stall-height", height: h }, "*"); }
  }
  new ResizeObserver(send).observe(wrap);
  window.addEventListener("load", send);
})();
</script>
